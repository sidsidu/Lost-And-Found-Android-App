// Top-level build file for Lost & Found Android App
// =====================================================================
// SETUP INSTRUCTIONS:
// 1. Go to https://console.firebase.google.com/
// 2. Create a new project (or use an existing one)
// 3. Add an Android app with package name: com.example.lostfound
// 4. Download the google-services.json file
// 5. Place google-services.json in the "app/" directory
// 6. In Firebase Console → Firestore Database → Create database (test mode)
// 7. Go to https://imgbb.com/ → Sign up (free) → https://api.imgbb.com/
//    → Copy your API key → Paste in Constants.kt
// =====================================================================

plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'com.google.gms.google-services' version '4.4.0' apply false
}
